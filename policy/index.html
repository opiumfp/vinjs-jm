олітика</h2><!----></div><div class="text-center pb-5" data-v-b678b218 data-v-581ab41b><div data-v-581ab41b></div></div></div></div></div></div></div></section><hr data-v-b678b218 data-v-581ab41b><section class="position-relative pb-5" data-v-b678b218 data-v-581ab41b><div id="contact" class="anchor-id" data-v-b678b218 data-v-581ab41b></div><div class="page-title text-center pt-5 pb-3" data-v-043d9cc6 data-v-581ab41b><h2 class="h2" data-v-043d9cc6>Contact Us</h2><!----></div><div class="contact-us" data-v-1c71c891 data-v-581ab41b><div class="container" data-v-1c71c891><div class="row justify-content-center" data-v-1c71c891><div class="col-12 col-md-6" data-v-1c71c891><div class="text-center pb-4" data-v-1c71c891><p class="h5 font-weight-normal" data-v-1c71c891>Follow us on social media for more information and news about the conference. <br data-v-1c71c891>See you soon!
          </p><div class="contact-us_social-icons navbar-expand d-inline-block h4 my-3" data-v-1c71c891><ul class="social-icons list-unstyled navbar-nav" data-v-3b034692 data-v-1c71c891><li class="social-icons_item nav-item" data-v-3b034692><a target="_blank" href="https://www.facebook.com/VinnytsiaJS/" class="social-icons_link nav-link" data-v-3b034692><i class="icon-facebook-square" data-v-3b034692></i></a></li><li class="social-icons_item nav-item" data-v-3b034692><a target="_blank" href="https://www.instagram.com/vinnytsiajs/" class="social-icons_link nav-link" data-v-3b034692><i class="icon-instagram" data-v-3b034692></i></a></li><li class="social-icons_item nav-item" data-v-3b034692><a target="_blank" href="https://twitter.com/VinnytsiaJS" class="social-icons_link nav-link" data-v-3b034692><i class="icon-twitter" data-v-3b034692></i></a></li><li class="social-icons_item nav-item" data-v-3b034692><a target="_blank" href="http://youtube.com/vinnytsiajs" class="social-icons_link nav-link" data-v-3b034692><i class="icon-youtube-play" data-v-3b034692></i></a></li><li class="social-icons_item nav-item" data-v-3b034692><a target="_blank" href="https://t.me/vinjs" class="social-icons_link nav-link" data-v-3b034692><i class="icon-telegram" data-v-3b034692></i></a></li></ul></div><div class="mb-3" data-v-1c71c891><a href="/policy/" class="btn btn-secondary py-1 m-1" data-v-1c71c891>Policy</a><a href="https://vinnytsiajs.org/docs/Code_of_Conduct_-_VinnytsiaJS.pdf" target="_blank" class="btn btn-secondary py-1 m-1" data-v-1c71c891>Code of Conduct</a></div><ul class="list-unstyled" data-v-1c71c891><li data-v-1c71c891><a href="mailto:info@vinnytsiajs.org" data-v-1c71c891>info@vinnytsiajs.org</a></li></ul></div></div></div></div></div></section></div></div><!----></div> <script>window.__INITIAL_STATE__={"data":{"policyData":{"title":"Policy","titleUA":"Політика","description":"Your privacy is important to us. It is VinnytsiaJS policy to respect your privacy regarding any information we may collect from you across our website \u003Chttps:\u002F\u002Fvinnytsiajs.org\u002F\u003E[](https:\u002F\u002Fwww.3bittalk.com\u002F,) and other sites we own and operate.\n\nWe only ask for personal information when we truly need it to provide a service to you. We collect it by fair and lawful means, with your knowledge and consent. We also let you know why we’re collecting it and how it will be used.\n\nWe only retain collected information for as long as necessary to provide you with your requested service. What data we store, we’ll protect within commercially acceptable means to prevent loss and theft, as well as unauthorized access, disclosure, copying, use, or modification.\n\nWe don’t share any personally identifying information publicly or with third-parties, except when required to by law.\n\nOur website may link to external sites that are not operated by us. Please be aware that we have no control over the content and practices of these sites, and cannot accept responsibility or liability for their respective privacy policies.\n\nYou are free to refuse our request for your personal information, with the understanding that we may be unable to provide you with some of your desired services.\n\nYour continued use of our website will be regarded as an acceptance of our practices around privacy and personal information. If you have any questions about how we handle user data and personal information, feel free to contact us.\n\n\\\n**Terms and Conditions**\n\nWhen clients buy a ticket for VinnytsiaJS events, they agreed to VinnytsiaJS Terms & Conditions. A copy of these Terms & Conditions can be found below.\n\n\\\n**Payment**\n\nPayment in full is due no later than 1 hour to the event start time. This may be made via electronic transfer, debit card, or credit card.\\\nAfter full payment, you have 14 days to request a refund. In the case of refund, you will receive back a 10% less amount than you've paid and it is due to ticket sell fees and other possible commissions.\n\n\\\n**Drugs and Alcohol**\n\nThe company may refuse participation to guests who are believed to be under the influence of drugs or alcohol. No refund will be made in such circumstances.\n\n\\\n**Company Authority**\n\nThe customer recognizes the authority of the company’s event manager and Skippers, understanding that they may take any decision they regard as necessary to ensure the health, welfare, and safety of those taking part in the event.\n\n\\\n**Force Majeure**\n\nThe company may postpone the event where forces outside of the company’s control such as bad weather, acts of terrorism, or other events that cannot be reasonably mitigated against, impact the running of the event. No liability for any costs or expenses incurred by the guest is accepted by the company in the event of cancellation or postponement. In the case of force majeure, VinnytsiaJS will refund the amount that was left after all expenses for preparation, fees, and any other commissions that VinnytsiaJS spent before the force majeure or will offer a discount for the next event. \n\n\\\n**Event Cancellation by VinnytsiaJS**\n\nThe VinnytsiaJS reserves the right to cancel an event due to circumstances that would make the event non-viable.If VinnytsiaJS cancels an event, registrants will be offered a full refund (except administrative and service fees that is 10% of the total amount)\\\nShould circumstances arise that result in the postponement of an event, registrants will have the option to either receive a full refund or transfer registration to the same event at the new, future date.\n\n\\\n**Copyright**\n\nThe company retains rights to images and videos taken during the event.\n\n\\\n**Ukrainian Law**\n\nThis agreement is subject to Ukrainian law.\n\n\\\nThis policy is effective as of 01 Feb 2021.","descriptionUA":"Ваша конфіденційність важлива для нас. Політика VinnytsiaJS поважає вашу конфіденційність щодо будь-якої інформації, яку ми можемо збирати від вас на нашому веб-сайті \u003Chttps:\u002F\u002Fvinnytsiajs.org\u002F\u003E[](https:\u002F\u002Fwww.3bittalk.com\u002F), та інших веб-сайтах наших проектів, якими ми володіємо та з якими працюємо.\n\n​\n\nМи просимо надати особисту інформацію лише тоді, коли нам вона справді потрібна для надання вам послуг. Ми збираємо інформацію чесними та законними способами з вашого відома та згоди. Ми також повідомляємо вам, чому ми її збираємо та як вона буде використаний.\n\n​\n\nМи не ділимося жодною інформацією, що ідентифікує особу, публічно або з третіми сторонами, крім випадків, коли це передбачено законодавством.\n\nНаш веб-сайт може посилатися на зовнішні сайти, якими ми не керуємо. Зверніть увагу, що ми не контролюємо вміст та положення цих веб-сайтів і не можемо нести відповідальність за їхню політику конфіденційності.\n\nВи можете відмовити у нашому запиті на отримання вашої особистої інформації з розумінням того, що через цю відмову ми можливо, не зможемо надати вам деякі з наших послуг.\n\nВаше подальше використання нашого веб-сайту буде розцінено як прийняття наших положень щодо політики конфіденційності та особистої інформації. Якщо у вас виникли запитання щодо того, як ми обробляємо дані користувачів та особисту інформацію, не соромтеся зв’язуватися з нами.\n\n**Правила та умови**\n\nКупуючи квиток на події VinnytsiaJS, користувачі автоматично погоджуються на Правила та умови VinnytsiaJS. Копію цих Загальних положень та умов можна знайти нижче.\n\n\\\n**Оплата**\n\nПовна оплата здійснюється не пізніше, ніж за 1 годину до часу початку події. Це може бути зроблено за допомогою електронного переказу, дебетової картки або кредитної картки.\\\nПісля повної оплати у вас є 14 днів (але не пізніше дати проведення події), щоб подати запит на повернення коштів. У разі повернення коштів, сума повернення становить на 10% менше загальної вартості квитка (в ці 10% включенна вартість комісій та інших адміністративних зборів)\n\n\\\n**Наркотики та алкоголь**\n\nКомпанія може відмовити в участі гостям, які, перебувають у стані алкогольного чи наркотичного сп’яніння. За таких обставин повернення коштів не здійснюється.\n\n\\\n**Повноваження компанії**\n\nКлієнт визнає повноваження керівника компанії та організаторів події, розуміючи, що вони можуть приймати будь-яке рішення, яке вважають необхідним для забезпечення здоров'я, добробуту та безпеки тих, хто бере участь у заході.\n\n\\\n**Форс мажори**\n\nКомпанія може відкласти подію, коли сили, що не перебувають під контролем компанії, такі як негода, терористичні акти чи інші події, вплив яких загрожує проведенню події або її учасникам. Компанія не несе відповідальності за будь-які витрати або втрати, понесені гостем, у разі скасування або перенесення. У разі форс-мажорних обставин VinnytsiaJS поверне суму, що залишилася після всіх витрат на підготовку, збори та будь-яку іншу комісії, які VinnytsiaJS витратив до форс-мажорних обставин або запропонує знижку на наступний захід.\n\n\\\n**Скасування події організаторами VinnytsiaJS**\n\nVinnytsiaJS залишає за собою право скасувати подію через обставини, які роблять подію нежиттєздатною. Якщо VinnytsiaJS скасує подію, всім зареєстрованим буде запропоновано повне повернення коштів (крім адміністративних та сервісних зборів, які складають 10% від загальної суми)\\\nУ разі виникнення обставин, що призводять до перенесення події, учасники будуть мати можливість отримати повне повернення коштів або перенести квиток без додаткових доплат на ту саму подію на нову, майбутню дату.\n\n\\\n**Авторське право**\n\nКомпанія зберігає права на зображення та відео, зроблені під час заходу.\n\n\\\n**Законодавсто України**\n\nЦя угода підпорядковується законодавству України.\n\nЦя положення вступають у дію з 01 лютого 2021 року."},"pageData":{"nav":{"button":{"active":true,"src":"https:\u002F\u002Ft.me\u002Fvinjs","title":"Follow Us"},"items":[{"active":true,"src":"#home","title":"Home"},{"active":true,"src":"#about","title":"About Us"},{"active":false,"src":"#schedule","title"
