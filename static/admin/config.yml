        - {label: "Map GoogleMap Link", name: "mapLinkGoogle", widget: "string", required: false, default: ''}
        

- name: "nav" # Used in routes, e.g., /admin/collections/blog
  label: "Nav Menu" # Used in the UI
  folder: "content/nav" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
  slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
  fields: # The fields for each document, usually in front matter
    - {label: "Title", name: "title", widget: "string"}
    - label: "Data"
      name: "data"
      widget: "object"
      fields:
      - label: "Nav Menu Items"
        name: "items"
        widget: "list"
        fields: 
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Link", name: "src", widget: "string"}
          - {label: "Active", name: "active", widget: "boolean", default: true}
      - label: "Social Icons"
        name: "socialicons"
        widget: "relation"
        collection: "socialicons"
        searchFields: ["title"]
        valueField: "data"
        required: false
        default: ''
        displayFields: ["title"] 
      - label: "Button"
        name: "button"
        widget: "object"
        required: false 
        default: ''
        fields:
        - {label: "Active", name: "active", widget: "boolean", required: false, default: true}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Link", name: "src", widget: "string", required: false, default: ''}


- name: "socialicons" # Used in routes, e.g., /admin/collections/blog
  label: "Social Icons" # Used in the UI
  folder: "content/socialicons" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
  slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
  fields: # The fields for each document, usually in front matter
    - {label: "Title", name: "title", widget: "string"}
    - label: "Data"
      name: "data"
      widget: "object"
      required: false 
      default: ''
      fields:
      - label: "Social Icons"
        name: "items"
        widget: "list"
        fields: 
          - {label: "Title", name: "title", widget: "string", required: false, default: ''}
          - {label: "Link", name: "src", widget: "string", required: false, default: ''}
          - label: "Icon"
            name: "icon"
            widget: "select"
            required: true
            default: "icon-facebook-square"
            options:
              - { label: "icon-facebook-square", value: "icon-facebook-square"}      
              - { label: "icon-twitter", value: "icon-twitter"}
              - { label: "icon-youtube-play", value: "icon-youtube-play"}
              - { label: "icon-instagram", value: "icon-instagram"}
              - { label: "icon-github", value: "icon-github"}
              - { label: "icon-telegram", value: "icon-telegram"}
              - { label: "icon-phone", value: "icon-phone"}
              - { label: "icon-envelope", value: "icon-envelope"}
          - {label: "Active", name: "active", widget: "boolean", required: false, default: true}


- name: "partners" # Used in routes, e.g., /admin/collections/blog
  label: "Partners" # Used in the UI
  folder: "content/partners" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
  slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
  fields: # The fields for each document, usually in front matter
    - {label: "Title", name: "title", widget: "string", required: true}
    - label: "Data"
      name: "data"
      widget: "object"
      required: false 
      default: ''
      fields:
      - {label: "Title", name: "title", widget: "string", required: false, default: ''}
      - {label: "Link", name: "src", widget: "string", required: false, default: ''}
      - {label: "Logo", name: "image", widget: "image", required: false, default: null}
      - {label: "Description", name: "description", widget: "markdown", required: false, default: ''}

- name: "speakers" # Used in routes, e.g., /admin/collections/blog
  label: "Speakers" # Used in the UI
  folder: "content/speakers" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
  identifier_field: name
  slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
  fields: # The fields for each document, usually in front matter
    - {label: "Name", name: "name", widget: "string", required: true}
    - label: "Data"
      name: "data"
      widget: "object"
      required: false 
      default: ''
      fields:
      - {label: "ID", name: "id", widget: "string", required: false, default: ''}
      - {label: "Name", name: "name", widget: "string", required: false, default: ''}
      - {label: "Title", name: "title", widget: "string", required: false, default: ''}
      - {label: "Company", name: "company", widget: "string", required: false, default: ''}
      - {label: "City", name: "city", widget: "string", required: false, default: ''}
      - {label: "Country", name: "country", widget: "string", required: false, default: ''}
      - {label: "Bio", name: "bio", widget: "markdown", required: false, default: ''}
      - label: "Social Links"
        name: "socialLinks"
        required: false
        default: ''
        widget: "list"
        fields: 
          - {label: "Link", name: "src", widget: "string", required: false, default: ''}
          - label: "Icon"
            name: "icon"
            widget: "select"
            required: false
            default: "icon-facebook-square"
            options:
              - { label: "icon-facebook-square", value: "icon-facebook-square"}      
              - { label: "icon-twitter", value: "icon-twitter"}
              - { label: "icon-youtube-play", value: "icon-youtube-play"}
              - { label: "icon-instagram", value: "icon-instagram"}
              - { label: "icon-github", value: "icon-github"}
              - { label: "icon-linkedin-square", value: "icon-linkedin-square"}
              - { label: "icon-telegram", value: "icon-telegram"}
              - { label: "icon-phone", value: "icon-phone"}
              - { label: "icon-envelope", value: "icon-envelope"}
      - {label: "Photo", name: "image", widget: "image", required: false, default: null}

- name: "talks" # Used in routes, e.g., /admin/collections/blog
  label: "Talks" # Used in the UI
  folder: "content/talks" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
