      - {label: "Description", name: "description", widget: "markdown", required: false, default: ''}

- name: "schedule" # Used in routes, e.g., /admin/collections/blog
  label: "Schedule" # Used in the UI
  folder: "content/schedule" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
  identifier_field: name
  slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
  fields: # The fields for each document, usually in front matter
    - {label: "Name", name: "name", widget: "string", required: true}
    - label: "Data"
      name: "data"
      widget: "object"
      required: false 
      default: ''
      fields:
      - {label: "Collapsed", name: "collapsed", widget: "boolean", default: true}
      - {label: "ID", name: "id", widget: "string", required: false, default: ''}
      - {label: "Title", name: "title", widget: "string", required: false, default: ''}
      - label: "Start time"
        name: "starttime"
        widget: "datetime"
        default: ""
        dateFormat: "DD.MM.YYYY" # e.g. 24.12.2021
        timeFormat: "HH:mm" # e.g. 21:07
        format: "LLL"
        pickerUtc: false
      - label: "End time"
        name: "endtime"
        widget: "datetime"
        default: ""
        dateFormat: "DD.MM.YYYY" # e.g. 24.12.2021
        timeFormat: "HH:mm" # e.g. 21:07
        format: "LLL"
        pickerUtc: false
      - {label: "Full Title", name: "fulltitle", widget: "string", required: false, default: ''}  
      - {label: "Description", name: "description", widget: "string", required: false, default: ''}  
      - {label: "Location", name: "location", widget: "string", required: false, default: ''}  
      - {label: "Location Link", name: "locationlink", widget: "string", required: false, default: ''}  
      - {label: "Online Link", name: "link", widget: "string", required: false, default: ''}  
      - {label: "Youtube Link", name: "linkyoutube", widget: "string", required: false, default: ''}  
      - {label: "Discord Link", name: "linkdiscord", widget: "string", required: false, default: ''}  
      - {label: "Buy Link", name: "linkbuy", widget: "string", required: false, default: ''}  
      - label: "Items"
        name: "items"
        widget: "list"
        required: false
        default: ''
        fields:
        - label: "Time"
          name: "time"
          widget: "datetime"
          default: ""
          dateFormat: "DD.MM.YYYY" # e.g. 24.12.2021
          timeFormat: "HH:mm" # e.g. 21:07
          format: "LLL"
          required: false
          pickerUtc: false
        - {label: "Activity (non talk)", name: "titlee", widget: "string", required: false, default: ''}
        - {label: "Activity Description", name: "titleedescription", widget: "markdown", required: false, default: ''}
        - label: "Talk"
          name: "talk"
          widget: "relation"
          collection: "talks"
          searchFields: ["name"]
          valueField: "data"
          displayFields: ["name"]
          required: false
