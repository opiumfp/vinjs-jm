backend:
  name: git-gateway
  branch: dev # Branch to update (optional; defaults to master)
media_folder: "/uploads" # Media files will be stored in the repo under static/images/uploads
public_folder: "/uploads" # The src attribute for uploaded media will begin with /images/uploa
collections:
- name: "conf" # Used in routes, e.g., /admin/collections/blog
  label: "Conference Page" # Used in the UI
  folder: "content/conf" # The path to the folder where the documents are stored
  create: true # Allow users to create new documents in this collection
  slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
  fields: # The fields for each document, usually in front matter
    - {label: "Title", name: "title", widget: "string"}
    - label: "Conference Date"
      name: "startDate"
      widget: "datetime"
      default: ''
      format: "LLLL"
      required: false
    - label: "Nav Menu"
      name: "nav"
      widget: "relation"
      collection: "nav"
      searchFields: ["title"]
      valueField: "data"
      displayFields: ["title"]

    - label: "Hero"
      name: "hero"
      widget: "object"
      fields:
      - {label: "Id", name: "id", widget: "string", required: false, default: ''}
      - {label: "Title", name: "title", widget: "string", required: false, default: ''}
      - {label: "Sub title", name: "subtitle", widget: "string", required: false, default: ''}
      - {label: "Date", name: "date", widget: "string", required: false, default: ''}
      - {label: "Image", name: "image", widget: "image", required: false, default: ''}
      - {label: "Image Portrait", name: "imagePt", widget: "image", required: false, default: ''}
      - label: "Button"
        name: "button"
        widget: "object"
        fields:
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "link", name: "link", widget: "string", required: false, default: ''}

    - label: "HeroPT"
      name: "heropt"
      widget: "object"
      fields:
      - {label: "Id", name: "id", widget: "string", required: false, default: ''}
      - {label: "Title", name: "title", widget: "string", required: false, default: ''}
      - {label: "Sub title", name: "subtitle", widget: "string", required: false, default: ''}
      - {label: "Date", name: "date", widget: "string", required: false, default: ''}
      - {label: "Image", name: "image", widget: "image", required: false, default: ''}
      - {label: "Image Portrait", name: "imagePt", widget: "image", required: false, default: ''}
      - label: "Button"
        name: "button"
        widget: "object"
        fields:
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "link", name: "link", widget: "string", required: false, default: ''}

    - label: "About"
      name: "about"
      widget: "object"
      fields:
        - {label: "Section ID", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Paragraph", name: "paragraph", widget: "markdown", required: false, default: ''}
        - {label: "logo", name: "logo", widget: "image", required: false, default: ''}
        - {label: "Button Title", name: "linkTitle", widget: "string", required: false, default: ''}
        - {label: "Button Link", name: "link", widget: "string", required: false, default: ''}

    - label: "Stat"
      name: "stat"
      widget: "object"
      fields:
        - {label: "Section ID", name: "id", widget: "string", required: false, default: ''}
        - {label: "Background", name: "image", widget: "image", required: false, default: ''}
        - {label: "Backgound Portrait", name: "imagePt", widget: "image", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          required: false
          default: ''
          fields:
          - {label: "Title", name: "title", widget: "markdown", required: false, default: ''}
          - {label: "Paragraph", name: "paragraph", widget: "markdown", required: false, default: ''}

    - label: "Media Tiles"
      name: "mediaTiles"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - {label: "Section ID", name: "id", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          fields: 
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Active", name: "active", widget: "boolean", default: "true"}
            - {label: "Coumn Width (desktop)", name: "colDesk", widget: "number", default: 4, required: false}
            - label: "Type"
              name: "type"
              widget: "select"
              required: true
              default: "gallery"
              options:
                - {label: "Image/Video Gallary", value: "gallery"}
                - {label: "Youtube Popup", value: "youtubePopup"}
                - {label: "Youtube Link", value: "youtubelink"}
                - {label: "Youtube Video", value: "youtube"}
            - {label: "Link/ID", name: "src", widget: "string", default: '', required: false}
            - {label: "Image", name: "image", widget: "image", default: null, required: false}

    - label: "Playlists"
      name: "playlists"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - {label: "Section ID", name: "id", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          fields: 
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Active", name: "active", widget: "boolean", default: "true"}
            - {label: "Coumn Width (desktop)", name: "colDesk", widget: "number", default: 4, required: false}
            - label: "Type"
              name: "type"
              widget: "select"
              required: true
              default: "gallery"
              options:
                - {label: "Image/Video Gallary", value: "gallery"}
                - {label: "Youtube Video", value: "youtube"}
                - {label: "Static text", value: "text"}
            - {label: "Link", name: "src", widget: "string", default: '', required: false}
            - {label: "Image", name: "image", widget: "image", default: null, required: false}
    - label: "Speakers"
      name: "speakers"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          default: ''
          required: false
          fields:
            - label: "Fields"
              name: "fields"
              widget: "relation"
              collection: "speakers"
              searchFields: ["name"]
              valueField: "data"
              displayFields: ["name"]
              required: false
              default: ''
            - label: "Talk"
              name: "talk"
              widget: "relation"
              collection: "talks"
              searchFields: ["name"]
              valueField: "data"
              displayFields: ["name"]
              required: false
              default: ''
            - {label: "Active", name: "active", widget: "boolean", default: "true"}

    - label: "Talks"
      name: "talks"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          default: ''
          required: false
          fields:
            - label: "Talk"
              name: "talk"
              widget: "relation"
              collection: "talks"
              searchFields: ["name"]
              valueField: "data"
              displayFields: ["name"]
              required: false
              default: ''
            - label: "Speaker"
              name: "speaker"
              widget: "relation"
              collection: "speakers"
              searchFields: ["name"]
              valueField: "data"
              displayFields: ["name"]
              required: false
              default: ''
            - {label: "Active", name: "active", widget: "boolean", default: "true"}

    - label: "Schedule"
      name: "schedule"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - label: "Schedules"
          name: "schedules"
          widget: "list"
          default: ''
          required: false
          fields:
            - label: "Schedule"
              name: "schedule"
              widget: "relation"
              collection: "schedule"
              searchFields: ["name"]
              valueField: "data"
              displayFields: ["name"]
              required: false
              default: ''
            - {label: "Active", name: "active", widget: "boolean", default: "true"}            

    - label: "Partners"
      name: "partners"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          default: ''
          required: false
          fields:
            - label: "Fields"
              name: "fields"
              widget: "relation"
              collection: "partners"
              searchFields: ["title"]
              valueField: "data"
              displayFields: ["title"]
            - label: "Logo"
              name: "image"
              widget: "relation"
              collection: "partners"
              searchFields: ["title"]
              valueField: "data.image"
              displayFields: ["title"]
            - {label: "Active", name: "active", widget: "boolean", default: "true"}

    - label: "Friends"
      name: "friends"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          default: ''
          required: false
          fields:
            - label: "Fields"
              name: "fields"
              widget: "relation"
              collection: "partners"
              searchFields: ["title"]
              valueField: "data"
              displayFields: ["title"]
            - label: "Logo"
              name: "image"
              widget: "relation"
              collection: "partners"
              searchFields: ["title"]
              valueField: "data.image"
              displayFields: ["title"]
            - {label: "Active", name: "active", widget: "boolean", default: "true"}


    - label: "MediaPartners"
      name: "mediapartners"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - label: "Items"
          name: "items"
          widget: "list"
          default: ''
          required: false
          fields:
            - label: "Fields"
              name: "fields"
              widget: "relation"
              collection: "partners"
              searchFields: ["title"]
              valueField: "data"
              displayFields: ["title"]
            - label: "Logo"
              name: "image"
              widget: "relation"
              collection: "partners"
              searchFields: ["title"]
              valueField: "data.image"
              displayFields: ["title"]
            - {label: "Active", name: "active", widget: "boolean", default: "true"}
    
    - label: "Pricing"
      name: "pricing"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - {label: "Section ID", name: "id", widget: "string", required: false, default: ''}
        - {label: "Currency Symbol", name: "currency", widget: "string"}
        - {label: "Coumns count (desktop)", name: "col", widget: "number", default: 4, required: false}
        - label: "Items"
          name: "items"
          widget: "list"
          fields: 
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Price", name: "price", widget: "string"}
            - {label: "Caption", name: "caption", widget: "string"}
            - {label: "Button Label", name: "btnLabel", widget: "string"}
            - {label: "Button Link", name: "btnSrc", widget: "string"}
            - label: "Status"
              name: "status"
              widget: "select"
              required: true
              default: "default"
              options:
                - {label: "Default", value: "default"}
                - {label: "Active", value: "active"}
                - {label: "Sold", value: "sold"}
            
    - label: "Location"
      name: "location"
      widget: "object"
      default: ''
      required: false
      fields:
        - {label: "Id", name: "id", widget: "string", required: false, default: ''}
        - {label: "Title", name: "title", widget: "string", required: false, default: ''}
        - {label: "Subtitle", name: "subtitle", widget: "string", required: false, default: ''}
        - {label: "Background", name: "image", widget: "image", required: false, default: ''}
        - {label: "Backgound Portrait", name: "imagePt", widget: "image", required: false, default: ''}
        - {label: "Location Logo", name: "logo", widget: "image", required: false, default: ''}
